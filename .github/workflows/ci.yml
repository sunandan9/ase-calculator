# .github/workflows/ci.yml
# GitHub Actions CI pipeline
# Runs on every push and pull request to any branch.

name: CI – Lint & Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest]

    steps:
      # ── 1. Check out source code ────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up the requested Python version ──────────────────────────
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # ── 3. Install dependencies ─────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # ── 4. Lint with flake8 ─────────────────────────────────────────────
      - name: Lint with flake8
        run: |
          echo "=== Running flake8 linter ==="
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Treat all other issues as warnings (exit-zero keeps CI green for style)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=99 --statistics

      # ── 5. Run unit tests ───────────────────────────────────────────────
      - name: Run unit tests with unittest
        run: |
          echo "=== Running unit tests ==="
          python -m unittest discover -v -s . -p "test_*.py"

      # ── 6. (Optional) Test with pytest for richer output ────────────────
      - name: Install pytest and run with coverage report
        run: |
          pip install pytest pytest-cov
          pytest test_calculator.py -v --tb=short \
            --cov=calculator --cov-report=term-missing
